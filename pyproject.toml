[project]
name = "perfagent"
version = "0.4.0"
description = "AI Performance Testing Agent — k6-first, with web UI (plan -> approve -> generate)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "instructor>=1.5,<2",
    "openai>=1.40",
    "anthropic>=0.34",
    "sqlalchemy>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "langgraph>=0.4,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "langgraph-checkpoint-postgres>=2.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
    "httpx>=0.27",
    "pytest-xdist>=3.8.0",
]

[project.optional-dependencies]
run = [
    "locust>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perfagent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
