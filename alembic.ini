# Alembic (database migrations) — command-line entry point.
#
# The app applies migrations by itself on start-up; you only need these commands
# when you CHANGE a model in src/perfagent/db/models.py:
#
#   uv run alembic revision --autogenerate -m "add X to Y"    # write the migration
#   uv run alembic upgrade head                               # apply it now (optional)
#   uv run alembic current                                    # which revision the DB is at
#
# The database is taken from DATABASE_URL (.env), the same as the app.

[alembic]
script_location = %(here)s/src/perfagent/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/src

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
